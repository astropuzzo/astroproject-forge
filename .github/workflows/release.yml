name: Release

# Pushing a tag vX.Y.Z builds every package and publishes the GitHub release that the in-app updater reads.
# The tag must match version.json; the notes are that version's section of docs/CHANGELOG.md.
# Run workflow (workflow_dispatch) on a branch publishes version.json's version from that commit,
# moving an unreleased tag of the same name there first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-packages:
    uses: ./.github/workflows/cross-platform.yml

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup 7
        shell: pwsh
        # Prefer Inno Setup 7 (64-bit setup, dynamic wizard style); the script still compiles with 6.x.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest Inno Setup 7 installer on the official jrsoftware/issrc GitHub releases (7.x may still be
          # marked pre-release there), then jrsoftware.org, then winget.
          $exe = "$env:RUNNER_TEMP\is.exe"
          $sources = @()
          try {
            $sources += (gh api repos/jrsoftware/issrc/releases --jq '[.[] | .assets[] | select(.name | test("^innosetup-7.*\\.exe$")) | .browser_download_url][0]')
          } catch { }
          $sources += 'https://jrsoftware.org/download.php/is.exe'
          "Sources: $($sources -join ', ')"
          $installed = $false
          foreach ($url in $sources | Where-Object { $_ }) {
            try {
              Invoke-WebRequest $url -OutFile $exe -MaximumRetryCount 3 -RetryIntervalSec 5
              Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS' -Wait
              $installed = $true; "Installed from $url"; break
            } catch { Write-Warning "$url : $_" }
          }
          if (-not $installed) { winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements }
          $iscc = Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)' -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Sort-Object { $_.VersionInfo.FileMajorPart }, { $_.VersionInfo.FileMinorPart } -Descending | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          "ISCC=$($iscc.FullName)" | Add-Content $env:GITHUB_ENV
          $iscc.VersionInfo.FileVersion
      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          ./build-distribution.ps1 -InnoCompiler $env:ISCC
          $v = (Get-Content version.json -Raw | ConvertFrom-Json)
          foreach ($kind in 'setup.exe', 'portable.zip') {
            $f = "artifacts/distribution/AstroProjectForge-$($v.channel)-$($v.version)-win-x64-$kind"
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: astroproject-forge-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/distribution/AstroProjectForge-*-win-x64-setup.exe
            artifacts/distribution/AstroProjectForge-*-win-x64-portable.zip

  publish:
    needs: [unix-packages, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: astroproject-forge-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version version.json)"
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$TAG" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version.json ($VERSION)"; exit 1; }
          else
            ! gh release view "$TAG" >/dev/null 2>&1 || { echo "Release $TAG already exists"; exit 1; }
            git push -f origin "$GITHUB_SHA:refs/tags/$TAG"
          fi
          awk -v h="## $VERSION " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' docs/CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $VERSION"; exit 1; }
          ls -l dist
          # same asset labels as the earlier hand-made releases
          files=()
          for f in dist/AstroProjectForge-*; do
            case "$f" in
              *-win-x64-setup.exe) files+=("$f#Windows installer") ;;
              *-win-x64-portable.zip) files+=("$f#Windows portable") ;;
              *) files+=("$f") ;;
            esac
          done
          gh release create "$TAG" "${files[@]}" --verify-tag --title "AstroProject Forge $VERSION" --notes-file notes.md --latest
      - name: Refresh the update feed
        # The app reads this small manifest first: it needs no call to the GitHub API, so it still finds the update
        # from a shared address (VPN, office) that has used up the anonymous API rate limit. Its hash and size are
        # those of the installer that was just published.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version version.json)"
          CHANNEL="$(jq -r .channel version.json)"
          BUILD="$(jq -r .minimumWindowsBuild version.json)"
          FEED="$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')"
          TAG="v$VERSION"
          SETUP="$(ls dist/AstroProjectForge-*-win-x64-setup.exe | head -n 1)"
          NAME="$(basename "$SETUP")"
          SHA="$(sha256sum "$SETUP" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$SETUP")"
          PUBLISHED="$(gh release view "$TAG" --json publishedAt --jq .publishedAt)"
          cat > "$FEED.json" <<EOF
          {
            "schema": 1,
            "product": "AstroProject Forge",
            "channel": "$CHANNEL",
            "version": "$VERSION",
            "publishedAtUtc": "$PUBLISHED",
            "installer": {
              "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$NAME",
              "sha256": "$SHA",
              "sizeBytes": $SIZE,
              "fileName": "$NAME"
            },
            "releaseNotesUrl": "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG",
            "minimumWindowsVersion": "10.0.$BUILD",
            "signed": false
          }
          EOF
          cat "$FEED.json"
          gh release view "channel-$FEED" >/dev/null 2>&1 || gh release create "channel-$FEED" --title "Update channel: $FEED" --notes "Update feed read by the application. Do not delete." --latest=false
          gh release upload "channel-$FEED" "$FEED.json" --clobber
